<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<style>
*{box-sizing:border-box;}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#4CAF50,#0b6623);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-box{
    background:white;
    width:420px;
    padding:35px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
    text-align:center;
}

.register-box h1{
    color:green;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0b6623;
}

a{
    text-decoration:none;
    color:green;
    font-weight:bold;
}

.login-link{
    margin-top:20px;
}
</style>
</head>

<body>

<div class="register-box">

<h1>👤 Create Account</h1>

<form method="POST">

<input type="text" name="name" placeholder="Enter Full Name" required>

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit">Register</button>

</form>

<div class="login-link">
<a href="/customer_login">Already have an account? Login</a>
</div>

</div>

</body>
</html>
