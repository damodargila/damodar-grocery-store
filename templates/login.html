```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    background:linear-gradient(135deg,#014421,#0b8f3a);
}

.left{
    width:55%;
    color:white;
    padding:60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo{
    font-size:48px;
    font-weight:bold;
    margin-bottom:15px;
}

.store{
    color:#8fff9f;
}

.heading{
    font-size:65px;
    font-weight:bold;
    margin:30px 0;
}

.subtitle{
    font-size:22px;
    margin-bottom:40px;
}

.features{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.feature{
    background:rgba(255,255,255,0.15);
    padding:15px;
    border-radius:12px;
}

.right{
    width:45%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.login-box{
    width:100%;
    max-width:520px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.login-box h1{
    text-align:center;
    margin-bottom:10px;
}

.login-box p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

label{
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-top:8px;
    margin-bottom:20px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0b8f3a;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#06722e;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#0b8f3a;
    font-weight:bold;
}

.security{
    margin-top:25px;
    background:#e8fff0;
    border-radius:10px;
    padding:15px;
    text-align:center;
    color:#0b8f3a;
    font-weight:bold;
}

@media(max-width:900px){

body{
    flex-direction:column;
}

.left,
.right{
    width:100%;
}

.heading{
    font-size:42px;
}

}

</style>
</head>

<body>

<div class="left">

<div class="logo">
🛒 DAMODAR
<span class="store">GROCERY STORE</span>
</div>

<div class="heading">
Admin Dashboard
</div>

<div class="subtitle">
Manage your store easily
</div>

<div class="features">

<div class="feature">📦 Manage Products</div>

<div class="feature">🧾 Orders</div>

<div class="feature">⭐ Reviews</div>

<div class="feature">📊 Reports</div>

</div>

</div>

<div class="right">

<div class="login-box">

<h1>🔐 Admin Login</h1>

<p>Welcome back! Please login to continue.</p>

<form action="/admin_login" method="POST">

<label>Username</label>
<input type="text" name="username" placeholder="Enter username" required>

<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>

<button type="submit">Login</button>

</form>

<a href="/" class="back">← Back To Store</a>

<div class="security">
✅ Authorized Admin Access Only
</div>

</div>

</div>

</body>
</html>
```
