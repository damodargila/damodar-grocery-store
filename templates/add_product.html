<!DOCTYPE html>
<html>
<head>
<title>Add Product</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:30px;}
.box{background:white;width:400px;padding:25px;border-radius:10px;box-shadow:0 0 8px gray;}
input{width:100%;padding:10px;margin:8px 0;}
button{background:green;color:white;padding:10px 20px;border:none;border-radius:5px;}
</style>
</head>
<body>

<div class="box">
<h1>➕ Add Product</h1>

<form action="/add_product" method="POST" enctype="multipart/form-data">
<label>Product Name:</label>
<input type="text" name="name" required>

<label>Category:</label>
<input type="text" name="category" required>

<label>Price:</label>
<input type="number" name="price" required>

<label>Stock:</label>
<input type="number" name="stock" value="10" required>

<label>Upload Image:</label>
<input type="file" name="image" required>

<button type="submit">Add Product</button>
</form>

<br>
<a href="/">Back To Store</a>
</div>

</body>
</html>
