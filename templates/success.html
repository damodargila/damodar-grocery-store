<!DOCTYPE html>
<html>
<head>
<title>Order Success</title>
<style>
body{text-align:center;font-family:Arial;background:#f5f5f5;padding-top:100px;}
h1{color:green;}
button{background:green;color:white;padding:10px 20px;border:none;border-radius:5px;}

/* Mobile polish added by Codex */
@media(max-width:640px){
html,body{width:100%;overflow-x:hidden}
body{font-size:14px}
.topbar{padding:12px 14px!important;gap:10px!important;flex-direction:column!important;align-items:stretch!important;height:auto!important}
.logo,.brand{font-size:22px!important;line-height:1.2}
.topbar a,.nav a,.navbar a{min-height:38px;display:inline-flex;align-items:center}
.nav,.navbar,.top-links{width:100%;max-width:100%;overflow-x:auto;flex-wrap:nowrap!important;gap:8px!important;padding-bottom:4px;scrollbar-width:none}
.nav::-webkit-scrollbar,.navbar::-webkit-scrollbar,.top-links::-webkit-scrollbar{display:none}
.search-form{width:100%!important;max-width:none!important;display:grid!important;grid-template-columns:1fr!important;border-radius:12px!important;overflow:hidden}
.search-form input,.search-form select,.search-form button{width:100%!important;margin:0!important;border-left:0!important;border-top:1px solid #e5e7eb!important;font-size:16px!important}
.search-form input{border-top:0!important}
.page,.container,.wrap{max-width:100%!important;padding:18px 12px 78px!important}
.hero,.page-head,.head,.order-head,.table-head{flex-direction:column!important;align-items:flex-start!important;gap:12px!important}
.hero{margin:12px!important;padding:20px!important;border-radius:14px!important}
.hero h1{font-size:26px!important;line-height:1.15!important}
.hero p{font-size:15px!important}
.layout,.grid,.cart-layout,.auth-page,.product-box,.dashboard-grid,.stats,.info-grid,.detail-grid{grid-template-columns:1fr!important}
.card{min-width:0!important}
img{max-width:100%}
input,select,textarea,button{font-size:16px!important}
.actions,.hero-actions,.table-tools,.coupon,.item-actions{width:100%;flex-direction:column!important;align-items:stretch!important}
.actions a,.actions button,.hero-actions a,.hero-actions button,.table-tools input,.table-tools select,.table-tools button,.coupon input,.coupon button{width:100%!important}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;width:100%}
table{min-width:760px}
.footer{padding:18px 12px!important}
}

@media(max-width:420px){
.products{grid-template-columns:1fr!important;padding-left:12px!important;padding-right:12px!important}
.main-img,.no-img{height:190px!important}
.shop-actions{grid-template-columns:1fr 1fr!important}
.btn{padding:11px 8px!important;font-size:13px!important}
}</style>
</head>
<body>

<h1>✅ Order Placed Successfully!</h1>
<p>Thank you for shopping with Damodar Grocery Store.</p>

<a href="/invoice/{{ order_id }}">
<button>Download Invoice PDF</button>
</a>

<br><br>

<a href="/">
<button>Back To Home</button>
</a>

</body>
</html>
