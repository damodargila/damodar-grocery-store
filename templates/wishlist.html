<!DOCTYPE html>
<html>
<head>
<title>Wishlist</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.products{display:flex;gap:20px;flex-wrap:wrap;}
.card{background:white;width:250px;padding:15px;border-radius:10px;box-shadow:0 0 5px gray;}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;}
.btn{background:green;color:white;padding:10px;text-decoration:none;border-radius:5px;}
</style>
</head>
<body>

<h1>❤️ Wishlist</h1>
<a href="/">Back To Store</a>

<div class="products">
{% for product in products %}
<div class="card">
{% if product[4] %}
<img src="{{ product[4] }}">
{% endif %}
<h2>{{ product[1] }}</h2>
<p>{{ product[2] }}</p>
<h3>₹{{ product[3] }}</h3>
<a class="btn" href="/add_to_cart/{{ product[0] }}">Add To Cart</a>
</div>
{% endfor %}
</div>

</body>
</html>
