<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Review</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#e8f5e9,#f5f5f5);
}

.review-container{
    max-width:500px;
    margin:60px auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

h1{
    text-align:center;
    color:#0b6623;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    margin-top:8px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
    box-sizing:border-box;
}

textarea{
    height:120px;
    resize:none;
}

button{
    width:100%;
    padding:14px;
    border:none;
    background:#0b6623;
    color:white;
    font-size:17px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#084d19;
}

.back-btn{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#0b6623;
    font-weight:bold;
}

.rating-info{
    color:#666;
    font-size:14px;
    margin-top:-10px;
    margin-bottom:15px;
}

</style>
</head>

<body>

<div class="review-container">

<h1>⭐ Add Review</h1>

<p class="subtitle">
Share your experience with Damodar Grocery Store
</p>

<form method="POST">

<label>Your Name</label>
<input type="text"
name="customer_name"
placeholder="Enter your name"
required>

<label>Rating</label>
<select name="rating" required>
<option value="">Select Rating</option>
<option value="5">⭐⭐⭐⭐⭐ Excellent</option>
<option value="4">⭐⭐⭐⭐ Very Good</option>
<option value="3">⭐⭐⭐ Good</option>
<option value="2">⭐⭐ Average</option>
<option value="1">⭐ Poor</option>
</select>

<label>Your Review</label>
<textarea
name="comment"
placeholder="Write your review here..."
required></textarea>

<button type="submit">
Submit Review
</button>

</form>

<a href="/" class="back-btn">
← Back to Home
</a>

</div>

</body>
</html>
