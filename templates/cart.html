<!DOCTYPE html>
<html>
<head>
<title>Cart</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px;}
.card{background:white;padding:15px;margin:10px;border-radius:10px;box-shadow:0 0 5px gray;}
.btn{padding:8px 15px;text-decoration:none;color:white;border-radius:5px;}
.plus{background:green;}
.minus{background:orange;}
.checkout{background:blue;padding:10px 20px;color:white;text-decoration:none;border-radius:5px;}
.total{font-size:22px;font-weight:bold;color:green;}
</style>
</head>
<body>

<h1>🛒 Cart</h1>

{% for item in products %}
<div class="card">
<h2>{{ item[0][1] }}</h2>
<p>Price: ₹{{ item[0][3] }}</p>
<p>Quantity: {{ item[1] }}</p>
<p>Subtotal: ₹{{ item[2] }}</p>

<a class="btn minus" href="/decrease/{{ item[0][0] }}">-</a>
<a class="btn plus" href="/increase/{{ item[0][0] }}">+</a>
</div>
{% endfor %}

<form action="/apply_coupon" method="POST">
<input type="text" name="coupon" placeholder="Enter coupon SAVE10">
<button type="submit">Apply Coupon</button>
</form>

<p class="total">Subtotal: ₹{{ total }}</p>
<p class="total">GST: ₹{{ gst }}</p>
<p class="total">Discount {{ discount_percent }}%: ₹{{ discount_amount }}</p>
<p class="total">Grand Total: ₹{{ grand_total }}</p>

<a class="checkout" href="/checkout">Checkout</a>
<br><br>
<a href="/">Back</a>

</body>
</html>
