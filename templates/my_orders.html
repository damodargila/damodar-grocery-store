<!DOCTYPE html>
<html>
<head><title>My Orders</title></head>
<body>
<h1>📦 My Orders</h1>

<table border="1" cellpadding="10">
<tr>
<th>ID</th>
<th>Address</th>
<th>Total</th>
<th>Status</th>
</tr>

{% for order in orders %}
<tr>
<td>{{ order[0] }}</td>
<td>{{ order[3] }}</td>
<td>₹{{ order[4] }}</td>
<td>{{ order[8] }}</td>
</tr>
{% endfor %}
</table>

<br>
<a href="/">Back To Store</a>
</body>
</html>
